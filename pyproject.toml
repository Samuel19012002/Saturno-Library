[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "saturn-library"
version = "0.1.0"
description = "Python development toolkit and CLI."
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
    "typer",
    "uvicorn",
]

[project.scripts]
sr = "saturn.cli.main:app"

[tool.setuptools.packages.find]
include = ["saturn*"]